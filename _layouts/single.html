---
layout: default
---
<header class="page-head">
  <div class="page-head-inner reveal">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </div>
</header>

<div class="page-shell">
  <article class="prose reveal">
    {{ content }}
  </article>
</div>
