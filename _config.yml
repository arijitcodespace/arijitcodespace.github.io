title: Arijit Dey
description: Machine Learning • Vision-Language • Graph ML • Optimization
tagline: "Incoming Ph.D. Student at MBZUAI · Vision-Language, Graph ML & Optimization"
locale: en-US

# Author profile (used in hero, footer, and meta)
author:
  name: "Arijit Dey"
  avatar: "/assets/img/passport.jpg"
  bio: "Incoming Ph.D. Student at MBZUAI · Data Scientist · MS ECE @ UCLA"
  email: "gekeryuken2012@gmail.com"
  linkedin: "https://www.linkedin.com/in/arijit-d-322066bb/"
  github: "https://github.com/arijitcodespace"
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:gekeryuken2012@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/arijit-d-322066bb/"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/arijitcodespace"

# Pretty links for posts
permalink: /:categories/:year/:month/:day/:title/

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins (all allowlisted on GitHub Pages)
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag

# Blog pagination
paginate: 5
paginate_path: /blog/page:num/

# Include the custom pages folder
include:
  - _pages

# Front-matter defaults: every page gets the single layout, posts get post
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      read_time: true

# Files to leave out of the build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _config.minima.backup.yml
  - docs                 # retired GNN-Keras3 documentation
  - assets/examples      # retired GNN-Keras3 example scripts
