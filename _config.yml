title: Arijit Dey
description: Machine Learning • Vision-Language • Graph ML • Optimization
tagline: "Machine Learning Researcher · Vision-Language, Graph ML & Optimization"
locale: en-US
url: "https://arijitcodespace.github.io"
baseurl: ""

# Author profile (used in hero, footer, and meta)
author:
  name: "Arijit Dey"
  avatar: "/assets/img/passport.jpg"
  bio: "Machine Learning Researcher · Data Scientist · MS ECE @ UCLA"
  email: "gekeryuken2012@gmail.com"
  linkedin: "https://www.linkedin.com/in/arijit-d-322066bb/"
  github: "https://github.com/arijitcodespace"
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:gekeryuken2012@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/arijit-d-322066bb/"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/arijitcodespace"

# Pretty links for posts
permalink: /:categories/:year/:month/:day/:title/

# Publish a post as soon as it is pushed, even if its date is still "tomorrow"
# in UTC (the build server's time zone). Matches GitHub Pages' old behaviour.
future: true

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins (installed from the Gemfile; _plugins/blog_tools.rb is loaded automatically)
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag

# LaTeX macros available in every post (a post can add its own with `macros:`
# in its front matter). Use single quotes so backslashes stay as typed.
math_macros:
  R: '\mathbb{R}'
  E: '\mathbb{E}'
  argmin: '\operatorname*{arg\,min}'
  argmax: '\operatorname*{arg\,max}'

# Blog pagination
paginate: 5
paginate_path: /blog/page:num/

# Include the custom pages folder
include:
  - _pages

# Front-matter defaults: every page gets the single layout, posts get post
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      read_time: true

# Files to leave out of the build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _config.minima.backup.yml
  - docs                 # retired GNN-Keras3 documentation
  - assets/examples      # retired GNN-Keras3 example scripts
